# Heatpump integration via ThingSpeak

# Input text to store API credentials (populated from secrets)
input_text:
  thingspeak_api_key:
    name: ThingSpeak API Key
    initial: !secret thingspeak_api_key
    mode: password
  
  thingspeak_channel:
    name: ThingSpeak Channel
    initial: !secret thingspeak_channel

# Input boolean to control grid event reactions
input_boolean:
  heatpump_night_mode:
    name: "React to Night Schedule"
    icon: mdi:weather-night
    initial: @night_mode@

  heatpump_grid_only:
    name: "React to Grid Events"
    icon: mdi:transmission-tower
    initial: @grid_only@

  heatpump_state_before_grid_off:
    name: "Heatpump State Before Grid Off"
    icon: mdi:memory
    initial: false

# Input numbers for temperature control
input_number:
  heatpump_battery_minimal_soc:
    name: "Battery Minimal SOC"
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-50
    initial: @battery_minimal_soc@

  heatpump_temperature_from:
    name: "Temperature From"
    min: 10
    max: 30
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low
    initial: @on_temperature_from@
  
  heatpump_temperature_to:
    name: "Temperature To"
    min: 10
    max: 30
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high
    initial: @on_temperature_to@

# REST command to update heatpump temperatures
rest_command:
  heatpump_update:
    url: "https://api.thingspeak.com/update.json?api_key={{ states('input_text.thingspeak_api_key') }}&field2={{ temperature_from }}&field3={{ temperature_to }}"
    method: GET
    timeout: 10

# Retry-capable script to update heatpump temperatures
script:
  heatpump_update_with_retry:
    alias: "Heatpump: Update with retry"
    mode: single
    fields:
      temperature_from:
        description: "Lower temperature"
        example: 15
      temperature_to:
        description: "Upper temperature"
        example: 18
      attempts:
        description: "Number of attempts"
        example: 5
        default: 5
      delay_seconds:
        description: "Delay between attempts"
        example: 10
        default: 10
    sequence:
      - variables:
          max_attempts: "{{ attempts | default(5, true) | int }}"
          retry_delay: "{{ delay_seconds | default(10, true) | int }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ max_attempts | int > 0 }}"
            sequence:
              - repeat:
                  count: "{{ max_attempts | int }}"
                  sequence:
                    - variables:
                        attempt: "{{ repeat.index }}"
                    - service: rest_command.heatpump_update
                      data:
                        temperature_from: "{{ temperature_from }}"
                        temperature_to: "{{ temperature_to }}"
                      response_variable: resp                    
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: >
                                {% set status = resp.status | int(-1) %}
                                {% if status != 200 %}
                                  false
                                {% else %}
                                  {% set returned_field2 = resp.content.field2 | default(0) | int %}
                                  {% set returned_field3 = resp.content.field3 | default(0) | int %}
                                  {% set expected_field2 = temperature_from | int %}
                                  {% set expected_field3 = temperature_to | int %}
                                  {{ returned_field2 == expected_field2 and returned_field3 == expected_field3 }}
                                {% endif %}
                          sequence:
                            - service: homeassistant.update_entity
                              target:
                                entity_id: sensor.heatpump_data
                            - service: logbook.log
                              data:
                                name: Heatpump
                                message: "Update succeeded on attempt {{ attempt }}: {{ temperature_from }}-{{ temperature_to }}°C (verified)"
                            - stop: "success"
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ not repeat.last }}"
                          sequence:
                            - delay:
                                seconds: "{{ retry_delay }}"
      - service: logbook.log
        data:
          name: Heatpump
          message: "Update failed after {{ max_attempts }} attempts: {{ temperature_from }}-{{ temperature_to }}°C"
  
  
# Sensors to track heatpump status
sensor:
  - platform: rest
    name: heatpump_data
    resource_template: "https://api.thingspeak.com/channels/{{ states('input_text.thingspeak_channel') }}/feeds.json?results=1"
    method: GET
    scan_interval: 300  # Update every 5 minutes
    value_template: "{{ value_json.feeds[0].entry_id if value_json.feeds else 'unavailable' }}"
    json_attributes_path: "$.feeds[0]"
    json_attributes:
      - field1
      - field2
      - field3
      - field4
      - field5
      - field6
      - created_at

# Template sensors (modern format)
template:
  - sensor:
      - name: "Heatpump Supply Temperature"
        unique_id: heatpump_supply_temperature
        unit_of_measurement: "°C"
        state: "{{ state_attr('sensor.heatpump_data', 'field1') | float(0) }}"
      
      - name: "Heatpump Temperature From"
        unique_id: heatpump_temperature_from
        unit_of_measurement: "°C"
        state: "{{ state_attr('sensor.heatpump_data', 'field2') | int(0) }}"
      
      - name: "Heatpump Temperature To"
        unique_id: heatpump_temperature_to
        unit_of_measurement: "°C"
        state: "{{ state_attr('sensor.heatpump_data', 'field3') | int(0) }}"
      
      - name: "Heatpump Return Temperature"
        unique_id: heatpump_return_temperature
        unit_of_measurement: "°C"
        state: "{{ state_attr('sensor.heatpump_data', 'field4') | float(0) }}"
      
      - name: "Heatpump Overheat"
        unique_id: heatpump_overheat
        unit_of_measurement: "°C"
        state: "{{ state_attr('sensor.heatpump_data', 'field5') | float(0) }}"
      
      - name: "Heatpump Evaporation"
        unique_id: heatpump_evaporation
        unit_of_measurement: "°C"
        state: "{{ state_attr('sensor.heatpump_data', 'field6') | float(0) }}"
      
      - name: "Heatpump Last Update"
        unique_id: heatpump_last_update
        state: "{{ state_attr('sensor.heatpump_data', 'created_at') }}"
        device_class: timestamp
      
      - name: "Heatpump Mode"
        unique_id: heatpump_mode
        state: >
          {% set temperature_from = states('sensor.heatpump_temperature_from') | int(0) %}
          {% set temperature_to = states('sensor.heatpump_temperature_to') | int(0) %}
          {% set off_temperature_from = @off_temperature_from@ %}
          {% set off_temperature_to = @off_temperature_to@ %}
          {% set on_temperature_from = states('input_number.heatpump_temperature_from') | int(0) %}
          {% set on_temperature_to = states('input_number.heatpump_temperature_to') | int(0) %}
          {% if temperature_from == off_temperature_from and temperature_to == off_temperature_to %}
            off
          {% elif temperature_from == on_temperature_from and temperature_to == on_temperature_to %}
            on
          {% else %}
            unknown
          {% endif %}
  
  - switch:
      - name: "Heatpump"
        unique_id: heatpump
        state: "{{ states('sensor.heatpump_mode') == 'on' }}"
        turn_on:
          service: script.heatpump_update_with_retry
          data:
            temperature_from: "{{ states('input_number.heatpump_temperature_from') | int }}"
            temperature_to: "{{ states('input_number.heatpump_temperature_to') | int }}"
        turn_off:
          service: script.heatpump_update_with_retry
          data:
            temperature_from: @off_temperature_from@
            temperature_to: @off_temperature_to@

# Automations for scheduled temperature changes
# These automations listen to night_schedule sensor state changes
automation:
  # Listen to night schedule turning off - Set to off mode
  - id: heatpump_night_schedule_off
    alias: "Heatpump: Night Schedule Off"
    description: "Turn off heatpump when night schedule turns off"
    trigger:
      - platform: state
        entity_id: binary_sensor.night_schedule
        to: "off"
        from: "on"
    condition:
      - condition: state
        entity_id: input_boolean.heatpump_night_mode
        state: "on"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.heatpump
      - service: logbook.log
        data:
          name: Heatpump
          message: "Night Schedule Off: turning off heatpump"
    mode: single

  # Listen to night schedule turning on - Set to on mode
  - id: heatpump_night_schedule_on
    alias: "Heatpump: Night Schedule On"
    description: "Turn on heatpump when night schedule turns on"
    trigger:
      - platform: state
        entity_id: binary_sensor.night_schedule
        to: "on"
        from: "off"
    condition:
      - condition: state
        entity_id: input_boolean.heatpump_night_mode
        state: "on"
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.heatpump
      - service: logbook.log
        data:
          name: Heatpump
          message: "Night Schedule On: turning on heatpump"
    mode: single

  # Listen to grid status changes - Set to off mode when grid off
  - id: heatpump_grid_off
    alias: "Heatpump: Grid Off"
    description: "Save heatpump state and turn off when grid goes off-grid"
    trigger:
      - platform: state
        entity_id: "@grid_status_sensor@"
        to: "off"
        from: "on"
    condition:
      - condition: state
        entity_id: input_boolean.heatpump_grid_only
        state: "on"
    action:
      - variables:
          heatpump_current_state: "{{ states('switch.heatpump') }}"
      - service: input_boolean.turn_{{ 'on' if heatpump_current_state == 'on' else 'off' }}
        target:
          entity_id: input_boolean.heatpump_state_before_grid_off
      - service: switch.turn_off
        target:
          entity_id: switch.heatpump
      - service: logbook.log
        data:
          name: Heatpump
          message: "Grid off detected: saving state ({{ heatpump_current_state }}) and turning off heatpump (grid_only mode)"
    mode: single

  # Check battery SOC when grid goes off (independent of grid_only)
  - id: heatpump_battery_protection_on_grid_off
    alias: "Heatpump: Battery Protection on Grid Off"
    description: "Turn off heatpump when grid goes off and battery SOC is below threshold"
    trigger:
      - platform: state
        entity_id: "@grid_status_sensor@"
        to: "off"
        from: "on"
    condition:
      - condition: template
        value_template: >
          {{ states('@battery_soc_sensor@') | float(0) < states('input_number.heatpump_battery_minimal_soc') | float(50) }}
      - condition: state
        entity_id: switch.heatpump
        state: "on"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.heatpump
      - service: logbook.log
        data:
          name: Heatpump
          message: "Grid off detected: battery SOC ({{ states('@battery_soc_sensor@') }}%) below threshold ({{ states('input_number.heatpump_battery_minimal_soc') }}%), turning off heatpump (battery protection)"
    mode: single

  # Monitor battery SOC during grid off (independent of grid_only)
  - id: heatpump_battery_low
    alias: "Heatpump: Battery Low During Grid Off"
    description: "Turn off heatpump when battery SOC drops below threshold during grid off"
    trigger:
      - platform: numeric_state
        entity_id: "@battery_soc_sensor@"
        below: input_number.heatpump_battery_minimal_soc
    condition:
      - condition: state
        entity_id: "@grid_status_sensor@"
        state: "off"
      - condition: state
        entity_id: switch.heatpump
        state: "on"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.heatpump
      - service: logbook.log
        data:
          name: Heatpump
          message: "Battery SOC dropped to {{ states('@battery_soc_sensor@') }}% (below {{ states('input_number.heatpump_battery_minimal_soc') }}%), turning off heatpump (battery protection)"
    mode: single

  # Listen to grid status changes - Set to on mode when grid on
  - id: heatpump_grid_on
    alias: "Heatpump: Grid On"
    description: "Restore heatpump state when grid comes back online"
    trigger:
      - platform: state
        entity_id: "@grid_status_sensor@"
        to: "on"
        from: "off"
    condition:
      - condition: state
        entity_id: input_boolean.heatpump_grid_only
        state: "on"
      
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.heatpump_state_before_grid_off
                state: "on"
              - condition: state
                entity_id: switch.heatpump
                state: "off"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.heatpump
              - service: logbook.log
                data:
                  name: Heatpump
                  message: "Grid on detected: restoring heatpump to ON"
        default:
          - service: logbook.log
            data:
              name: Heatpump
              message: "Grid on detected: heatpump already in desired state ({{ states('switch.heatpump') }}), no action needed"
    mode: single

  # Clear saved state when grid comes on (always runs to ensure cleanup)
  - id: heatpump_grid_on_cleanup
    alias: "Heatpump: Grid On Cleanup"
    description: "Clear saved state when grid comes on and grid_only is enabled"
    trigger:
      - platform: state
        entity_id: "@grid_status_sensor@"
        to: "on"
        from: "off"
    condition:
      - condition: state
        entity_id: input_boolean.heatpump_grid_only
        state: "on"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.heatpump_state_before_grid_off
      - service: logbook.log
        data:
          name: Heatpump
          message: "Grid on detected: cleared saved state (grid_only mode)"
    mode: single
