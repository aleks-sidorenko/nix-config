# Heatpump integration via ThingSpeak

# Input text to store API credentials (populated from secrets)
input_text:
  thingspeak_api_key:
    name: ThingSpeak API Key
    initial: !secret thingspeak_api_key
    mode: password
  
  thingspeak_channel:
    name: ThingSpeak Channel
    initial: !secret thingspeak_channel

# Input numbers for temperature control
input_number:
  heatpump_minimal_temp_from:
    name: "Minimal Temperature From"
    min: 10
    max: 30
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low
    initial: @minimal_temp_from@
  
  heatpump_minimal_temp_to:
    name: "Minimal Temperature To"
    min: 10
    max: 30
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high
    initial: @minimal_temp_to@
  
  heatpump_full_temp_from:
    name: "Full Temperature From"
    min: 10
    max: 30
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low
    initial: @full_temp_from@
  
  heatpump_full_temp_to:
    name: "Full Temperature To"
    min: 10
    max: 30
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high
    initial: @full_temp_to@

# REST command to update heatpump temperatures
rest_command:
  heatpump_update:
    url: "https://api.thingspeak.com/update.json?api_key={{ states('input_text.thingspeak_api_key') }}&field2={{ temp_from }}&field3={{ temp_to }}"
    method: GET
    timeout: 10

# Retry-capable script to update heatpump temperatures
script:
  heatpump_update_with_retry:
    alias: "Heatpump: Update with retry"
    mode: single
    fields:
      temp_from:
        description: "Lower temperature"
        example: 15
      temp_to:
        description: "Upper temperature"
        example: 18
      attempts:
        description: "Number of attempts"
        example: 5
        default: 5
      delay_seconds:
        description: "Delay between attempts"
        example: 10
        default: 10
    sequence:
      - variables:
          max_attempts: "{{ attempts | default(5, true) | int }}"
          retry_delay: "{{ delay_seconds | default(10, true) | int }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ max_attempts | int > 0 }}"
            sequence:
              - repeat:
                  count: "{{ max_attempts | int }}"
                  sequence:
                    - variables:
                        attempt: "{{ repeat.index }}"
                    - service: rest_command.heatpump_update
                      data:
                        temp_from: "{{ temp_from }}"
                        temp_to: "{{ temp_to }}"
                      response_variable: resp                    
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: >
                                {% set status = resp.status | int(-1) %}
                                {% if status != 200 %}
                                  false
                                {% else %}
                                  {% set returned_field2 = resp.content.field2 | default(0) | int %}
                                  {% set returned_field3 = resp.content.field3 | default(0) | int %}
                                  {% set expected_field2 = temp_from | int %}
                                  {% set expected_field3 = temp_to | int %}
                                  {{ returned_field2 == expected_field2 and returned_field3 == expected_field3 }}
                                {% endif %}
                          sequence:
                            - service: homeassistant.update_entity
                              target:
                                entity_id: sensor.heatpump_data
                            - service: logbook.log
                              data:
                                name: Heatpump
                                message: "Update succeeded on attempt {{ attempt }}: {{ temp_from }}-{{ temp_to }}°C (verified)"
                            - stop: "success"
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ not repeat.last }}"
                          sequence:
                            - delay:
                                seconds: "{{ retry_delay }}"
      - service: logbook.log
        data:
          name: Heatpump
          message: "Update failed after {{ max_attempts }} attempts: {{ temp_from }}-{{ temp_to }}°C"
  
  heatpump_apply_minimal_mode:
    alias: "Heatpump: Apply Minimal Mode"
    mode: single
    sequence:
      - service: script.heatpump_update_with_retry
        data:
          temp_from: "{{ states('input_number.heatpump_minimal_temp_from') | int }}"
          temp_to: "{{ states('input_number.heatpump_minimal_temp_to') | int }}"
  
  heatpump_apply_full_mode:
    alias: "Heatpump: Apply Full Mode"
    mode: single
    sequence:
      - service: script.heatpump_update_with_retry
        data:
          temp_from: "{{ states('input_number.heatpump_full_temp_from') | int }}"
          temp_to: "{{ states('input_number.heatpump_full_temp_to') | int }}"

# Sensors to track heatpump status
sensor:
  - platform: rest
    name: heatpump_data
    resource_template: "https://api.thingspeak.com/channels/{{ states('input_text.thingspeak_channel') }}/feeds.json?results=1"
    method: GET
    scan_interval: 300  # Update every 5 minutes
    value_template: "{{ value_json.feeds[0].entry_id if value_json.feeds else 'unavailable' }}"
    json_attributes:
      - feeds

# Template sensors (modern format)
template:
  - sensor:
      - name: "Heatpump Temperature From"
        unique_id: heatpump_temp_from
        unit_of_measurement: "°C"
        state: >
          {% set feeds = state_attr('sensor.heatpump_data', 'feeds') %}
          {% if feeds and feeds | length > 0 %}
            {{ feeds[0].field2 | float(0) }}
          {% else %}
            0
          {% endif %}
      
      - name: "Heatpump Temperature To"
        unique_id: heatpump_temp_to
        unit_of_measurement: "°C"
        state: >
          {% set feeds = state_attr('sensor.heatpump_data', 'feeds') %}
          {% if feeds and feeds | length > 0 %}
            {{ feeds[0].field3 | float(0) }}
          {% else %}
            0
          {% endif %}
      
      - name: "Heatpump Last Update"
        unique_id: heatpump_last_update
        state: >
          {% set feeds = state_attr('sensor.heatpump_data', 'feeds') %}
          {% if feeds and feeds | length > 0 %}
            {{ feeds[0].created_at }}
          {% else %}
            unavailable
          {% endif %}
        device_class: timestamp
      
      - name: "Heatpump Status"
        unique_id: heatpump_status
        state: >
          {% set feeds = state_attr('sensor.heatpump_data', 'feeds') %}
          {% if feeds and feeds | length > 0 %}
            {% set temp_from = feeds[0].field2 | float(0) %}
            {% set temp_to = feeds[0].field3 | float(0) %}
            {% if temp_from > 0 and temp_to > 0 %}
              {{ temp_from }}°C - {{ temp_to }}°C
            {% else %}
              Unknown
            {% endif %}
          {% else %}
            Unknown
          {% endif %}

# Automations for scheduled temperature changes
# These automations listen to night_schedule sensor state changes
automation:
  # Listen to night schedule turning off - Set to minimal mode
  - id: heatpump_night_schedule_off
    alias: "Heatpump: Night Schedule Off"
    description: "Set heatpump temperatures to minimal mode when night schedule turns off"
    trigger:
      - platform: state
        entity_id: binary_sensor.night_schedule
        to: "off"
    action:
      - service: script.heatpump_update_with_retry
        data:
          temp_from: "{{ states('input_number.heatpump_minimal_temp_from') | int }}"
          temp_to: "{{ states('input_number.heatpump_minimal_temp_to') | int }}"
      - service: logbook.log
        data:
          name: Heatpump
          message: "Night Schedule Off activated: {{ states('input_number.heatpump_minimal_temp_from') }}°C - {{ states('input_number.heatpump_minimal_temp_to') }}°C"
    mode: single

  # Listen to night schedule turning on - Set to full mode
  - id: heatpump_night_schedule_on
    alias: "Heatpump: Night Schedule On"
    description: "Set heatpump temperatures to full mode when night schedule turns on"
    trigger:
      - platform: state
        entity_id: binary_sensor.night_schedule
        to: "on"
    action:
      - service: script.heatpump_update_with_retry
        data:
          temp_from: "{{ states('input_number.heatpump_full_temp_from') | int }}"
          temp_to: "{{ states('input_number.heatpump_full_temp_to') | int }}"
      - service: logbook.log
        data:
          name: Heatpump
          message: "Night Schedule On activated: {{ states('input_number.heatpump_full_temp_from') }}°C - {{ states('input_number.heatpump_full_temp_to') }}°C"
    mode: single

  # Listen to grid status changes - Set to minimal mode when grid off
  - id: heatpump_grid_off
    alias: "Heatpump: Grid Off"
    description: "Set heatpump temperatures to minimal mode when grid status changes to Off-Grid"
    trigger:
      - platform: state
        entity_id: binary_sensor.inverter_grid
        to: "off"
    action:
      - service: script.heatpump_update_with_retry
        data:
          temp_from: "{{ states('input_number.heatpump_minimal_temp_from') | int }}"
          temp_to: "{{ states('input_number.heatpump_minimal_temp_to') | int }}"
      - service: logbook.log
        data:
          name: Heatpump
          message: "Grid off detected: switching to minimal mode {{ states('input_number.heatpump_minimal_temp_from') }}°C - {{ states('input_number.heatpump_minimal_temp_to') }}°C"
    mode: single

  # Listen to grid status changes - Set to full mode when grid on
  - id: heatpump_grid_on
    alias: "Heatpump: Grid On"
    description: "Set heatpump temperatures to full mode when grid status changes to Grid Connected"
    trigger:
      - platform: state
        entity_id: binary_sensor.inverter_grid
        to: "on"
    condition:
      - condition: state
        entity_id: binary_sensor.night_schedule
        state: "on"
    action:
      - service: script.heatpump_update_with_retry
        data:
          temp_from: "{{ states('input_number.heatpump_full_temp_from') | int }}"
          temp_to: "{{ states('input_number.heatpump_full_temp_to') | int }}"
      - service: logbook.log
        data:
          name: Heatpump
          message: "Grid on detected: switching to full mode {{ states('input_number.heatpump_full_temp_from') }}°C - {{ states('input_number.heatpump_full_temp_to') }}°C"
    mode: single
