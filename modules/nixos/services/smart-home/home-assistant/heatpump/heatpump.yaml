# Heatpump integration via ThingSpeak

# Input text to store API credentials (populated from secrets)
input_text:
  thingspeak_api_key:
    name: ThingSpeak API Key
    initial: !secret thingspeak_api_key
    mode: password
  
  thingspeak_channel:
    name: ThingSpeak Channel
    initial: !secret thingspeak_channel

# REST command to update heatpump temperatures
rest_command:
  heatpump_update:
    url: "https://api.thingspeak.com/update.json?api_key={{ states('input_text.thingspeak_api_key') }}&field2={{ temp_from }}&field3={{ temp_to }}"
    method: GET
    timeout: 10

# Retry-capable script to update heatpump temperatures
script:
  heatpump_update_with_retry:
    alias: "Heatpump: Update with retry"
    mode: single
    fields:
      temp_from:
        description: "Lower temperature"
        example: 15
      temp_to:
        description: "Upper temperature"
        example: 18
      attempts:
        description: "Number of attempts"
        example: 3
        default: 3
      delay_seconds:
        description: "Delay between attempts"
        example: 2
        default: 2
    sequence:
      - variables:
          attempt: 1
      - repeat:
          while: "{{ attempt <= attempts }}"
          sequence:
            - service: rest_command.heatpump_update
              data:
                temp_from: "{{ temp_from }}"
                temp_to: "{{ temp_to }}"
              response_variable: resp
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {% set status = resp.status | int(-1) %}
                        {% set body = resp.content | default('') %}
                        {% set numeric = (body | int(0)) %}
                        {% set ok_numeric = numeric > 0 %}
                        {% set ok_json = ('"entry_id"' in body and ('"entry_id": 0' not in body)) %}
                        {{ status == 200 and (ok_numeric or ok_json) }}
                  sequence:
                    - service: homeassistant.update_entity
                      target:
                        entity_id: sensor.heatpump_data
                    - service: logbook.log
                      data:
                        name: Heatpump
                        message: "Update succeeded on attempt {{ attempt }}: {{ temp_from }}-{{ temp_to }}°C"
                    - stop: "success"
            - delay:
                seconds: "{{ delay_seconds }}"
            - variables:
                attempt: "{{ attempt + 1 }}"
      - service: logbook.log
        data:
          name: Heatpump
          message: "Update failed after {{ attempts }} attempts: {{ temp_from }}-{{ temp_to }}°C"

# Sensors to track heatpump status
sensor:
  - platform: rest
    name: heatpump_data
    resource_template: "https://api.thingspeak.com/channels/{{ states('input_text.thingspeak_channel') }}/feeds.json?results=1"
    method: GET
    scan_interval: 300  # Update every 5 minutes
    value_template: "{{ value_json.feeds[0].entry_id if value_json.feeds else 'unavailable' }}"
    json_attributes:
      - feeds

# Template sensors (modern format)
template:
  - sensor:
      - name: "Heatpump Temperature From"
        unique_id: heatpump_temp_from
        unit_of_measurement: "°C"
        state: >
          {% set feeds = state_attr('sensor.heatpump_data', 'feeds') %}
          {% if feeds and feeds | length > 0 %}
            {{ feeds[0].field2 | float(0) }}
          {% else %}
            0
          {% endif %}
      
      - name: "Heatpump Temperature To"
        unique_id: heatpump_temp_to
        unit_of_measurement: "°C"
        state: >
          {% set feeds = state_attr('sensor.heatpump_data', 'feeds') %}
          {% if feeds and feeds | length > 0 %}
            {{ feeds[0].field3 | float(0) }}
          {% else %}
            0
          {% endif %}
      
      - name: "Heatpump Last Update"
        unique_id: heatpump_last_update
        state: >
          {% set feeds = state_attr('sensor.heatpump_data', 'feeds') %}
          {% if feeds and feeds | length > 0 %}
            {{ feeds[0].created_at }}
          {% else %}
            unavailable
          {% endif %}
        device_class: timestamp
      
      - name: "Heatpump Status"
        unique_id: heatpump_status
        state: >
          {% set feeds = state_attr('sensor.heatpump_data', 'feeds') %}
          {% if feeds and feeds | length > 0 %}
            {% set temp_from = feeds[0].field2 | float(0) %}
            {% set temp_to = feeds[0].field3 | float(0) %}
            {% if temp_from > 0 and temp_to > 0 %}
              {{ temp_from }}°C - {{ temp_to }}°C
            {% else %}
              Unknown
            {% endif %}
          {% else %}
            Unknown
          {% endif %}

# Automations for scheduled temperature changes
automation:
  # Morning schedule: 7:00 AM - Set to minimal mode
  - id: heatpump_morning_schedule
    alias: "Heatpump: Morning Schedule"
    description: "Set heatpump temperatures to minimal mode at 7:00 AM"
    trigger:
      - platform: time
        at: "07:00:00"
    action:
      - service: script.heatpump_update_with_retry
        data:
          temp_from: @minimal_temp_from@
          temp_to: @minimal_temp_to@
      - service: logbook.log
        data:
          name: Heatpump
          message: "Morning schedule activated: @minimal_temp_from@°C - @minimal_temp_to@°C"
    mode: single

  # Night schedule: 11:00 PM - Set to full mode
  - id: heatpump_night_schedule
    alias: "Heatpump: Night Schedule"
    description: "Set heatpump temperatures to full mode at 11:00 PM"
    trigger:
      - platform: time
        at: "23:00:00"
    action:
      - service: script.heatpump_update_with_retry
        data:
          temp_from: @full_temp_from@
          temp_to: @full_temp_to@
      - service: logbook.log
        data:
          name: Heatpump
          message: "Night schedule activated: @full_temp_from@°C - @full_temp_to@°C"
    mode: single

