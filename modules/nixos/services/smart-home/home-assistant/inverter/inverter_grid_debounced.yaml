# Inverter Grid Debounced Template Sensor
# Creates a debounced binary sensor that only changes state after the raw grid sensor
# has been stable for a configured duration. This prevents false triggers from brief outages.

template:
  - binary_sensor:
      - name: "Inverter Grid Debounced"
        unique_id: inverter_grid_debounced
        device_class: power
        state: "{{ is_state('binary_sensor.inverter_grid', 'on') }}"
        delay_on: @delaySeconds@  # Only turn on after being stable for this many seconds
        delay_off: @delaySeconds@  # Only turn off after being stable for this many seconds
        icon: >
          {% if is_state('binary_sensor.inverter_grid_debounced', 'on') %}
            mdi:transmission-tower
          {% else %}
            mdi:transmission-tower-off
          {% endif %}
        availability: "{{ not is_state('binary_sensor.inverter_grid', 'unavailable') }}"
