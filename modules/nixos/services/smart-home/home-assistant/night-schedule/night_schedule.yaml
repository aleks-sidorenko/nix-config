# Night Schedule Sensor
# Provides sensor.night_schedule with values "on" or "off"
# Other automations can listen to state changes of this sensor

# Input datetime helpers to store schedule times
input_datetime:
  night_schedule_on_time:
    name: "Night Schedule On Time"
    has_date: false
    has_time: true
    initial: "@night_on_time@"
  
  night_schedule_off_time:
    name: "Night Schedule Off Time"
    has_date: false
    has_time: true
    initial: "@night_off_time@"

# Template sensor that determines if we're in night mode
template:
  - binary_sensor:
      - name: "Night Schedule"
        unique_id: night_schedule
        state: >
          {% set now_time = now().strftime('%H:%M') %}
          {% set on_time = states('input_datetime.night_schedule_on_time')[:5] %}
          {% set off_time = states('input_datetime.night_schedule_off_time')[:5] %}
          {% if on_time < off_time %}
            {# Normal case: e.g., 08:00 to 22:00 #}
            {{ on_time <= now_time < off_time }}
          {% else %}
            {# Crosses midnight: e.g., 23:00 to 07:00 #}
            {{ now_time >= on_time or now_time < off_time }}
          {% endif %}

# Automation to log state changes
automation:
  - id: night_schedule_changed
    alias: "Night Schedule: Changed"
    description: "Log when night schedule changes"
    trigger:
      - platform: state
        entity_id: binary_sensor.night_schedule
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
    action:
      - service: logbook.log
        data:
          name: Night Schedule
          message: >
            Night mode {{ 'activated' if trigger.to_state.state == 'on' else 'deactivated' }} 
            (binary_sensor.night_schedule changed to {{ trigger.to_state.state }})
    mode: single
