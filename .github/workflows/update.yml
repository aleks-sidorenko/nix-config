name: "Update Dependencies"

on:
  schedule:
    # Run weekly on Sundays at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  update-flake:
    name: "Update Flake Inputs"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Update flake inputs
        run: |
          nix flake update --commit-lock-file

      - name: Check if updates were made
        id: check-updates
        run: |
          if git diff --quiet HEAD~1 HEAD -- flake.lock; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "No updates were made"
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "Updates were made"
          fi

      - name: Test updated flake
        if: steps.check-updates.outputs.updated == 'true'
        run: |
          nix flake check --all-systems --show-trace

      - name: Create Pull Request
        if: steps.check-updates.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: |
            ## Automated Flake Input Updates
            
            This PR contains automated updates to the flake inputs.
            
            ### Changes
            - Updated `flake.lock` with latest input versions
            
            ### Testing
            - ✅ `nix flake check` passed
            
            **Auto-generated by workflow on:** ${{ github.run_id }}
          branch: automated/update-flake-inputs
          delete-branch: true

  update-wallpapers:
    name: "Check for Wallpaper Updates"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build wallpapers package
        run: |
          nix build .#packages.x86_64-linux.wallpapers --show-trace
