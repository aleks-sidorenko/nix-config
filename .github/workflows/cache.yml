name: "Build and Cache"

on:
  push:
    branches: ["master"]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'systems/**'
      - 'homes/**'
      - 'modules/**'
      - 'packages/**'
  schedule:
    # Rebuild cache daily at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build-and-cache:
    name: "Build Popular Configs"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - type: "nixos"
            name: "server-vm"
            attr: "nixosConfigurations.server-vm.config.system.build.toplevel.drvPath"
          - type: "home"
            name: "alexander@server-vm"
            attr: 'homeConfigurations."alexander@server-vm".activationPackage.drvPath'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU for aarch64 emulation
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-user-static binfmt-support
          sudo update-binfmts --enable

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-platforms = aarch64-linux

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build ${{ matrix.config.type }} configuration - ${{ matrix.config.name }}
        run: |
          echo "Building: ${{ matrix.config.attr }}"
          # aarch64 guests: a full build under x86 emulation would outrun the
          # runner's time limit, so evaluate only, as ci.yml does.
          nix eval .#${{ matrix.config.attr }} --show-trace
          
          # Store build info
          echo "## ${{ matrix.config.type }}: ${{ matrix.config.name }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully evaluated ${{ matrix.config.attr }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Get output size
        run: |
          if [ -L result ]; then
            size=$(du -sh result | cut -f1)
            echo "Build size: $size" >> $GITHUB_STEP_SUMMARY
          fi

  build-iso:
    name: "Build Install ISO"
    runs-on: ubuntu-latest
    # Only build ISO on manual trigger or schedule to save resources
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build ISO
        run: |
          nix build .#nixosConfigurations.minimal.config.system.build.isoImage --show-trace
          
          echo "## Install ISO" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully built minimal install ISO" >> $GITHUB_STEP_SUMMARY
          
          if [ -L result ]; then
            size=$(du -sh result | cut -f1)
            echo "ISO size: $size" >> $GITHUB_STEP_SUMMARY
          fi
