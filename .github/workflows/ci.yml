name: "CI"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: "Flake Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      # --all-systems also builds every system's checks, which this runner
      # can't do for darwin or aarch64; build only ours, then evaluate the rest.
      # Order matters: --no-build never copies the flake source into the store,
      # so on a fresh runner it fails with "path ... is not valid".
      - name: Check flake
        run: nix flake check --show-trace

      - name: Evaluate flake (all systems)
        run: nix flake check --all-systems --no-build --show-trace

  formatting:
    name: "Check Formatting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Check formatting
        run: |
          nix fmt -- --ci

  build-systems:
    name: "Build NixOS Systems"
    runs-on: ubuntu-latest
    needs: [flake-check]
    # Note: server-vm is aarch64-linux (ARM64), requires emulation on x86_64 runners
    strategy:
      fail-fast: false
      matrix:
        system:
          - "server-vm"
          - "minimal-x86_64"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU for aarch64 emulation
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-user-static binfmt-support
          sudo update-binfmts --enable

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-platforms = aarch64-linux

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build NixOS system
        run: |
          system="${{ matrix.system }}"
          case "$system" in
            "server-vm")
              # aarch64 headless guest: a full build under x86 emulation would
              # outrun the runner's time limit. Evaluation still catches missing
              # options and failed assertions.
              nix eval .#nixosConfigurations.$system.config.system.build.toplevel.drvPath --show-trace
              ;;
            "minimal-x86_64")
              # Snowfall-lib creates install-isoConfigurations from systems/x86_64-install-iso/
              nix build .#install-isoConfigurations.$system --show-trace
              ;;
          esac

  build-home-manager:
    name: "Build Home Manager"
    runs-on: ubuntu-latest
    needs: [flake-check]
    strategy:
      fail-fast: false
      matrix:
        config:
          - "alexander@server-vm"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build Home Manager configuration
        run: |
          config="${{ matrix.config }}"
          attr='.#homeConfigurations."'"$config"'".activationPackage'
          if [ "$config" = "alexander@server-vm" ]; then
            # aarch64 guest — evaluate only, as in build-systems above.
            nix eval "$attr".drvPath --show-trace
          else
            nix build "$attr" --show-trace
          fi

  build-packages:
    name: "Build Custom Packages"
    runs-on: ubuntu-latest
    needs: [flake-check]
    strategy:
      fail-fast: false
      matrix:
        system: ["x86_64-linux", "aarch64-linux"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU for aarch64 emulation
        if: matrix.system == 'aarch64-linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-user-static binfmt-support
          sudo update-binfmts --enable

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: ${{ matrix.system == 'aarch64-linux' && 'extra-platforms = aarch64-linux' || '' }}

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build packages
        run: |
          # Build install package
          nix build .#packages.${{ matrix.system }}.install --show-trace || echo "install package not available for ${{ matrix.system }}"

          # Build wallpapers package
          nix build .#packages.${{ matrix.system }}.wallpapers --show-trace || echo "wallpapers package not available for ${{ matrix.system }}"

  build-darwin:
    name: "Build Darwin"
    runs-on: macos-latest
    needs: [flake-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build darwin system configuration
        run: |
          nix build .#darwinConfigurations.workbook.system --show-trace

      - name: Build darwin Home Manager configuration
        run: |
          nix build .#homeConfigurations."oleksandrsy@workbook".activationPackage --show-trace

  check-deployment:
    name: "Check Deployment"
    runs-on: ubuntu-latest
    needs: [flake-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Check deployment configuration
        run: |
          # Check if deploy configurations are valid
          nix flake show --json | jq -r '.deploy // empty'

          # Build deploy-rs checks if available
          nix build .#checks.x86_64-linux.deploy-rs --show-trace || echo "deploy-rs checks not available"

  check-dev-shells:
    name: "Check Development Shells"
    runs-on: ubuntu-latest
    needs: [flake-check]
    strategy:
      fail-fast: false
      matrix:
        system: ["x86_64-linux"]
        shell: ["default"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build development shell
        run: |
          nix build .#devShells.${{ matrix.system }}.${{ matrix.shell }} --show-trace || echo "Shell ${{ matrix.shell }} not available"

  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  summary:
    name: "CI Summary"
    runs-on: ubuntu-latest
    needs:
      - flake-check
      - formatting
      - build-systems
      - build-home-manager
      - build-packages
      - build-darwin
      - check-deployment
      - check-dev-shells
      - security-scan
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.flake-check.result }}" == "success" ]]; then
            echo "✅ Flake check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Flake check failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.formatting.result }}" == "success" ]]; then
            echo "✅ Formatting check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Formatting check failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.build-systems.result }}" == "success" ]]; then
            echo "✅ NixOS systems built successfully" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.build-systems.result }}" == "failure" ]]; then
            echo "❌ NixOS systems build failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.build-home-manager.result }}" == "success" ]]; then
            echo "✅ Home Manager configurations built successfully" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.build-home-manager.result }}" == "failure" ]]; then
            echo "❌ Home Manager configurations build failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.build-packages.result }}" == "success" ]]; then
            echo "✅ Custom packages built successfully" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.build-packages.result }}" == "failure" ]]; then
            echo "❌ Custom packages build failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.build-darwin.result }}" == "success" ]]; then
            echo "✅ Darwin configuration built successfully" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.build-darwin.result }}" == "failure" ]]; then
            echo "❌ Darwin configuration build failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.check-deployment.result }}" == "success" ]]; then
            echo "✅ Deployment checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Deployment checks failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.check-dev-shells.result }}" == "success" ]]; then
            echo "✅ Development shells checked" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Development shells check failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.security-scan.result }}" == "success" ]]; then
            echo "✅ Security scan completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Security scan failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build completed at:** $(date)" >> $GITHUB_STEP_SUMMARY
