# Make a user key
# mkdir -p ~/.config/sops/age
# age-keygen -o ~/.config/sops/age/keys.txt
# chmod 600 ~/.config/sops/age/keys.txt

# Display the user public key:
# age-keygen -y ~/.config/sops/age/keys.txt

# Make a host public key:
# nix-shell -p ssh-to-age
# ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub

# Add secrets
# sops secrets/secrets.yaml

# Rekey secrets.yaml after editing recipients in .sops.yaml:
# sops updatekeys secrets/secrets.yaml
keys:
  - &users:
    - &alexander 07E36E87C0270E464DB4D663B423D1630A58837C

  - &hosts:
    - &workbook age123w5drucfk50cvw26lt6mrhhnmrdjshg7waqsp4ufnm69ujc04gqhu4h3r
    - &server-vm age1t40qfjpzsccg8uahks8g5dy4hzvefq28akygnfc3yuze2xugafgsdxmc0v

creation_rules:
  - path_regex: modules/nixos/secrets.ya?ml$
    key_groups:
      - pgp:
          - *alexander
        age:
          - *server-vm

  - path_regex: modules/home/secrets.ya?ml$
    key_groups:
      - pgp:
          - *alexander
        age:
          - *workbook
          - *server-vm

  - path_regex: modules/darwin/secrets.ya?ml$
    key_groups:
      - pgp:
          - *alexander
        age:
          - *workbook

  - path_regex: infra/secrets.ya?ml$
    key_groups:
      - pgp:
          - *alexander
        age:
          - *workbook

  - path_regex: infra/router/secrets.ya?ml$
    key_groups:
      - pgp:
          - *alexander
        age:
          - *workbook

  - path_regex: infra/tailnet/secrets.ya?ml$
    key_groups:
      - pgp:
          - *alexander
        age:
          - *workbook

  - path_regex: infra/dns/secrets.ya?ml$
    key_groups:
      - pgp:
          - *alexander
        age:
          - *workbook

  - path_regex: infra/storage/secrets.ya?ml$
    key_groups:
      - pgp:
          - *alexander
        age:
          - *workbook
